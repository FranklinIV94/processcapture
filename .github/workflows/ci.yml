name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: pip install faster-whisper pytesseract pillow openai
      - run: python3 -c "import json; [json.load(open(f'schemas/{f}')) for f in ['recording.json','timeline.json']]"